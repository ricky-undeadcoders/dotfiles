# Terminal Command Center - Project Template
# Generated by mux-new. Customize as needed.
# Usage: mux <session-name>

name: <%= @settings["name"] %>
root: <%= @settings["root"] %>

windows:
  - main:
      layout: even-horizontal
      panes:
        - editor:
            - exec ~/.claude/scripts/run-nvim.sh
        - claude:
            - exec ~/.claude/scripts/run-claude.sh
  - shell:
      panes:
        - zsh
