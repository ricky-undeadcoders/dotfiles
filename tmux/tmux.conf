# ========================================
# Terminal Command Center - tmux Configuration
# ========================================

# Basic Settings
set -g mouse on
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 1
set -g focus-events on
setw -g aggressive-resize on

# Word selection breaks only on whitespace
set -g word-separators " "

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ========================================
# Key Bindings
# ========================================

# Change prefix to Ctrl+a (optional - comment out if you prefer Ctrl+b)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ========================================
# Panel Toggle System
# ========================================
# Toggle scripts live in ~/.claude/scripts/. Each checks if its pane exists
# and either creates or kills it.

# Panel toggles
# Left sidebar (narrow)
bind-key -n M-1 run-shell "~/.claude/scripts/toggle-panel.sh cheat"
bind-key -n M-2 run-shell "~/.claude/scripts/toggle-panel.sh todo"
# Center
bind-key -n M-7 run-shell "~/.claude/scripts/toggle-panel.sh editor"
# Right sidebar (wide)
bind-key -n M-9 run-shell "~/.claude/scripts/toggle-panel.sh claude"
bind-key -n M-0 run-shell "~/.claude/scripts/toggle-panel.sh terminal"

# Unbind old/unused keys
unbind-key -n M-3
unbind-key -n M-4
unbind-key -n M-5
unbind-key -n M-6
unbind-key -n M-8

# Focus mode - close left sidebar only
bind-key -n M-f run-shell "~/.claude/scripts/focus-mode.sh"

# Reset layout - restore all open panels to original sizing
bind-key -n M-= run-shell "~/.claude/scripts/reset-layout.sh"

# Kill current pane (no prefix). Note: shadows shell Ctrl-X (e.g. zsh edit-command-line)
bind-key -n C-x kill-pane

# Quit - kill entire session
bind-key -n M-q confirm-before -p "Kill session? (y/n)" kill-session

# ========================================
# Status Bar Configuration
# ========================================

set -g status-position top
set -g status-justify centre
set -g status-style 'bg=#16181a fg=#7b8496'

# Left side: session name
set -g status-left-length 40
set -g status-left '#[fg=#16181a,bg=#bd5eff,bold] #S #[fg=#bd5eff,bg=#16181a,nobold] '

# Center: window list shows between left and right (status-justify centre)
# The current directory is shown via the window status format below

# Right side: git branch, system stats, time
set -g status-right-length 200
set -g status-right '#[fg=#ff5ea0,bg=#16181a,bold]#{?client_prefix, PREFIX ,}#[fg=#5ef1ff,bg=#16181a,bold]  #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "no git")  #[fg=#7b8496] |  #[fg=#bd5eff]CPU: #(~/.claude/scripts/tmux-cpu.sh)  #[fg=#7b8496]|  #[fg=#ff5ea0]MEM: #(~/.claude/scripts/tmux-mem.sh)  #[fg=#7b8496]|  #[fg=#5eff6c]BAT: #(~/.claude/scripts/tmux-bat.sh)  #[fg=#7b8496]|  #[fg=#f1ff5e,bold] %b %d  %H:%M:%S '

# Auto-rename windows to basename of pane's cwd; manual rename (prefix ,) sticks
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Window status format
setw -g window-status-current-style 'fg=#5ea1ff bg=#3c4048 bold'
setw -g window-status-current-format ' #I#[fg=#7b8496]:#[fg=#ffffff]#W#[fg=#5ef1ff]#F '
setw -g window-status-style 'fg=#7b8496 bg=#16181a'
setw -g window-status-format ' #I#[fg=#3c4048]:#[fg=#7b8496]#W#[fg=#3c4048]#F '

# ========================================
# Pane Borders
# ========================================

set -g pane-border-style 'fg=#3c4048'
set -g pane-active-border-style 'fg=#bd5eff'

# ========================================
# Message Style
# ========================================

set -g message-style 'fg=#16181a bg=#f1ff5e bold'

# ========================================
# Copy Mode (vim-style)
# ========================================

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse drag selection copies to clipboard automatically
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Double-click selects word, copies to clipboard, opens URL if selection is one
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.claude/scripts/tmux-copy-open.sh"
bind-key -T root DoubleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.claude/scripts/tmux-copy-open.sh"

# Triple-click selects line and copies
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"

# ========================================
# Terminal Integration
# ========================================

# Window title shows session name (visible in Mission Control, tab bars)
set -g set-titles on
set -g set-titles-string "#S"

# Clipboard integration (OSC 52)
set -g set-clipboard on
